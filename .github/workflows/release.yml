name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate release tag and calculate Android version code
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must use vMAJOR.MINOR.PATCH (received $GITHUB_REF_NAME)" >&2
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          if (( minor > 999 || patch > 999 )); then
            echo "MINOR and PATCH must be at most 999 for Android versionCode mapping" >&2
            exit 1
          fi
          code=$((major * 1000000 + minor * 1000 + patch))
          if (( code < 1 || code > 2100000000 )); then
            echo "Calculated Android versionCode is outside the supported range" >&2
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Prepare signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.HOLODRIVE_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/holodrive-release.p12"
          chmod 600 "$RUNNER_TEMP/holodrive-release.p12"
      - name: Test, lint, and build signed release APK
        env:
          HOLODRIVE_RELEASE_STORE_FILE: ${{ runner.temp }}/holodrive-release.p12
          HOLODRIVE_RELEASE_STORE_PASSWORD: ${{ secrets.HOLODRIVE_RELEASE_STORE_PASSWORD }}
          HOLODRIVE_RELEASE_KEY_ALIAS: ${{ secrets.HOLODRIVE_RELEASE_KEY_ALIAS }}
          HOLODRIVE_RELEASE_KEY_PASSWORD: ${{ secrets.HOLODRIVE_RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew
          -PholodriveVersionName=${{ steps.version.outputs.name }}
          -PholodriveVersionCode=${{ steps.version.outputs.code }}
          :app:testServerDebugUnitTest
          :app:lintServerRelease
          :app:assembleServerRelease
      - name: Verify signature and prepare release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/server/release/app-server-release.apk dist/holodrive-photos.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/holodrive-photos.apk
          (cd dist && sha256sum holodrive-photos.apk > holodrive-photos.apk.sha256)
          cat > dist/INSTALL.txt <<'EOF'
          Holodrive Photos for Android

          Install:
          1. Download holodrive-photos.apk on Android 11 or newer.
          2. Open the APK and accept Android's install prompt. If asked, allow
             your browser or file manager to install apps from this source.
          3. For future updates, install Obtainium from its official releases,
             choose Add app, and enter:
             https://github.com/cybercoretech/holodrive-android-app

          Verify the APK on Linux or macOS:
            sha256sum --check holodrive-photos.apk.sha256

          The APK is signed by the Holodrive Photos release key. Android will
          accept updates only when signed with the same key.
          EOF
          {
            echo "## Holodrive Photos ${{ steps.version.outputs.name }}"
            echo
            echo "Signed Android 11+ APK. See the attached INSTALL.txt for installation, update, and SHA-256 verification instructions."
            echo
            echo 'Install with [Obtainium](https://github.com/ImranR98/Obtainium/releases/latest) by adding `https://github.com/cybercoretech/holodrive-android-app`.'
            echo
            echo "The APK and source are licensed under Apache-2.0; bundled font files have a separate OFL license."
          } > dist/RELEASE_NOTES.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/holodrive-photos.apk \
            dist/holodrive-photos.apk.sha256 \
            dist/INSTALL.txt \
            --title "Holodrive Photos ${{ steps.version.outputs.name }}" \
            --notes-file dist/RELEASE_NOTES.md
