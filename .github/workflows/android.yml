name: Android
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify Keysmith wordlist asset
        run: echo '6d557f0693958fb5e650b68b5bee585eb82cf4da32965505c789e924743bc522  app/src/main/assets/keysmith/eff-large.txt' | sha256sum --check
      - name: Create ephemeral debug signing key
        run: |
          mkdir -p "$HOME/Vaults/android"
          chmod 700 "$HOME/Vaults/android"
          keytool -genkeypair -keystore "$HOME/Vaults/android/holodrive-debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          chmod 600 "$HOME/Vaults/android/holodrive-debug.keystore"
      - name: Build and check
        run: ./gradlew assembleDebug test lint assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: holodrive-photos-debug
          path: app/build/outputs/apk/server/debug/app-server-debug.apk
          if-no-files-found: error
